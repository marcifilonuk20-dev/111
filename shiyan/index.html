<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="数学笔记 — 个人数学知识分享">
  <meta name="author" content="数学爱好者">
  <title>数学笔记</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 防止深色模式闪烁 -->
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t) { document.documentElement.setAttribute('data-theme', t); return; }
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  <header class="site-header">
    <div class="container">
      <a href="/" class="site-logo">数学笔记</a>
      <button class="nav-toggle" aria-label="菜单">☰</button>
      <nav class="site-nav">
        <a href="/" class="active" aria-current="page">首页</a>
        <a href="articles/">文章</a>
        <a href="about.html">关于</a>
      </nav>
      <button class="theme-toggle" aria-label="切换深色模式">🌙</button>
    </div>
  </header>

  <main id="main-content">
    <!-- Hero -->
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">数学笔记</h1>
        <p class="hero-subtitle">记录数学学习过程中的理解与思考，分享数学之美</p>
      </div>
    </section>

    <!-- 精选文章 -->
    <section class="featured-section">
      <div class="container">
        <h2 class="section-title">精选文章</h2>
        <div class="article-grid" id="featured-grid">
          <!-- JS 动态渲染 -->
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="cta-section">
      <a href="articles/" class="cta-link">浏览全部文章 →</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 数学笔记</p>
      <a href="#" class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">返回顶部 ↑</a>
    </div>
  </footer>

  <!-- KaTeX JS -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
