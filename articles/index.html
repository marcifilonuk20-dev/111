<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#5b5ef7">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="数学笔记 — 全部文章">
  <meta name="theme-color" content="#5b5ef7">
  <title>文章列表 — 数学笔记</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t) { document.documentElement.setAttribute('data-theme', t); return; }
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
  <div class="scroll-progress"></div>
  <canvas id="particles-canvas"></canvas>
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  <header class="site-header">
    <div class="container">
      <a href="../" class="site-logo">数学笔记</a>
      <button class="nav-toggle" aria-label="菜单">☰</button>
      <nav class="site-nav">
        <a href="../">首页</a>
        <a href="./" class="active" aria-current="page">文章</a>
        <a href="../about.html">关于</a>
      </nav>
      <button class="theme-toggle" aria-label="切换深色模式">🌙</button>
    </div>
  </header>

  <main id="main-content">
    <div class="container">
      <div class="page-header">
        <h1>所有文章</h1>
        <div class="section-line"></div>
      </div>
      <div class="filters-bar">
        <input type="search" id="search-input" class="search-box" placeholder="搜索文章...">
        <div class="category-filters" id="category-filters"></div>
      </div>
      <div id="article-list" class="prose"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 数学笔记</p>
      <a href="#" class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">↑ 返回顶部</a>
    </div>
  </footer>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="../js/main.js"></script>
</body>
</html>
